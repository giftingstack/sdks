# XcodeGen spec for the demo app (https://github.com/yonaskolb/XcodeGen).
#   brew install xcodegen
#   cd packages/sdk-ios/Demo && xcodegen generate && open GiftingStackDemo.xcodeproj
# Used by two CI jobs: sdk-ios.yml "demo" (simulator build, signing off) and
# sdk-ios-testflight.yml (device archive, automatic signing, TestFlight upload).
# The manual Xcode steps in ../README.md work without it.
name: GiftingStackDemo
options:
  bundleIdPrefix: com.giftingstack
  deploymentTarget:
    iOS: "15.0"
packages:
  GiftingStack:
    path: ..
targets:
  GiftingStackDemo:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # Assets.xcassets: the AppIcon (one 1024x1024 PNG, no alpha).
      - path: Resources
    dependencies:
      - package: GiftingStack
    # A shared scheme named after the target, so xcodebuild -scheme finds it.
    scheme: {}
    # XcodeGen writes this Info.plist on every `xcodegen generate` (it is git-ignored) and sets
    # INFOPLIST_FILE. Explicit keys instead of INFOPLIST_KEY_* settings, so every key TestFlight
    # checks is visible here.
    info:
      path: Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleDisplayName: GiftingStack
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        LSRequiresIPhoneOS: true
        # Only HTTPS through URLSession, no custom crypto: exempt, so no export compliance prompt.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarStyle: UIStatusBarStyleLightContent
    settings:
      base:
        # The TestFlight workflow overrides these two on the xcodebuild command line
        # (DEMO_BUNDLE_ID=..., DEMO_TEAM_ID=...). Own names so the override does not reach the
        # GiftingStack package target.
        DEMO_BUNDLE_ID: com.giftingstack.demo
        DEMO_TEAM_ID: ""
        PRODUCT_BUNDLE_IDENTIFIER: $(DEMO_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(DEMO_TEAM_ID)
        CODE_SIGN_STYLE: Automatic
        # MARKETING_VERSION is the version testers see; CURRENT_PROJECT_VERSION is the build
        # number, which must grow with every upload (the workflow passes github.run_number).
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
