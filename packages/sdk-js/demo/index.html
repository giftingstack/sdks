      body,

      }

    <nav class="demos" aria-label="Demos">
      <a href="/" aria-current="page">React Native (web)</a>

    <div id="root"></div>
    <!-- react-native-web's pre-bundled Animated reads the Node name "global". -->

    </script>
    <script type="module" src="./main.tsx"></script>
