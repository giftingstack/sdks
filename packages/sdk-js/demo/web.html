<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0a0a11" />
    <title>GiftingStack demo</title>
    <!-- In the head, not imported from web.ts: render-blocking, so the first paint is already styled
         (an import from the module only applies once the scripts ran, about a second on the dev server). -->
    <link rel="stylesheet" href="./pixel.css" />
  </head>
  <body>
    <div id="app" data-theme="dark">
      <header class="side">
        <div class="logo" id="logo" aria-label="GiftingStack">
          <img src="./gs-logo.png" alt="" width="30" height="30" />
          <span>GiftingStack</span>
        </div>
        <button class="coin-chip" id="coin-chip" type="button" aria-label="Get coins">
          <i></i><span id="coin-chip-n">0</span><small>+</small>
        </button>
        <nav class="tabs" aria-label="Main">
          <button class="tab" type="button" data-tab="feed" aria-current="page">
            <svg viewBox="0 0 24 24">
              <path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z" />
            </svg>
            Feed
          </button>
          <button class="tab" type="button" data-tab="live">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="2.5" />
              <path
                d="M7.5 7.5a6.4 6.4 0 0 0 0 9M16.5 7.5a6.4 6.4 0 0 1 0 9M4.5 4.5a10.6 10.6 0 0 0 0 15M19.5 4.5a10.6 10.6 0 0 1 0 15"
              />
            </svg>
            Live
          </button>
          <button class="tab" type="button" data-tab="chat">
            <svg viewBox="0 0 24 24">
              <path d="M4 5h16v11H9l-5 4z" />
            </svg>
            Chat
          </button>
          <button class="tab narrow" type="button" data-tab="top">
            <svg viewBox="0 0 24 24">
              <path
                d="M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3M12 14v4M8 20h8"
              />
            </svg>
            Top
          </button>
          <button class="tab narrow" type="button" data-tab="inbox">
            <svg viewBox="0 0 24 24"><path d="M6 17V11a6 6 0 0 1 12 0v6l1.5 2h-15zM10 21h4" /></svg>
            Inbox
            <span class="badge" id="badge" hidden>0</span>
          </button>
          <button class="tab" type="button" data-tab="me">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="8" r="4" />
              <path d="M4 21a8 8 0 0 1 16 0" />
            </svg>
            Me
          </button>
        </nav>
      </header>
      <div class="banner" id="banner" role="alert" hidden>
        You are offline. Gifts and updates will resume when you reconnect.
      </div>
      <main class="main" id="main">
        <section class="panel" data-panel="feed" aria-label="Feed"></section>
        <section class="panel" data-panel="live" aria-label="Live" hidden></section>
        <section class="panel dm" data-panel="chat" aria-label="Chat" hidden></section>
        <section class="panel" data-panel="top" aria-label="Top" hidden></section>
        <section class="panel" data-panel="inbox" aria-label="Inbox" hidden></section>
        <section class="panel me" data-panel="me" aria-label="Me" hidden></section>
        <footer class="foot">
          Hold the logo for the developer menu
          <br /><a href="/">React Native demo</a>
        </footer>
      </main>
      <aside class="right" id="right" aria-label="Top and inbox"></aside>
    </div>
    <script type="module" src="./web.ts"></script>
  </body>
</html>
