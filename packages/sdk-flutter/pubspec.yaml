name: giftingstack
description: >-
  Virtual gift tray, gift effects, gift wall, leaderboard and live gift rooms
  for Flutter apps that use the GiftingStack API.
version: 0.1.1
homepage: https://giftingstack.com
repository: https://github.com/giftingstack/sdks/tree/main/packages/sdk-flutter
issue_tracker: https://github.com/giftingstack/sdks/issues
topics:
  - gifting
  - virtual-gifts
  - leaderboard
  - animation
  - ui

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
