name: iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Swift package (macOS host tests, iOS Simulator build)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Spec data matches recipes.json
        run: node tool/generate-spec-data.mjs --check
        working-directory: packages/sdk-ios

      - name: Build (macOS host)
        run: swift build

      - name: Test (macOS host, every conformance fixture)
        run: swift test

      - name: List schemes
        run: xcodebuild -list

      - name: Build for iOS Simulator
        run: >
          xcodebuild build
          -scheme GiftingStack
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath .build/xcode
          CODE_SIGNING_ALLOWED=NO
